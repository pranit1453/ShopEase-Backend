spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  cloud:
    stream:
      default:
        content-type: application/json
      bindings:
        otpVerificationEvent-out-0:
          destination: otp.registration.requested
          content-type: application/json

        passwordChangeOtpEvent-out-0:
          destination: otp.passwordchange.requested
          content-type: application/json

        emailChangeOtpNotification-out-0:
          destination: otp.emailchange.requested
          content-type: application/json

        emailChangeSecurityAlert-out-0:
          destination: notification.emailchange.alert
          content-type: application/json

  security:
    secret:
      key:
      expiration: 900
      issuer: spring

    refresh:
      expiration: 604800

    cookie:
      name:
        refreshTokenName: refreshToken
        accessTokenName: accessToken
      cookieHttpOnly: true
      cookieSecure: false
      cookieSameSite: lax
      cookieDomain: localhost

    oauth2:
      client:
        registration:
          google:
            client-id:
            client-secret:
            scope:
              - email
              - profile
              - openid
          github:
            client-id:
            client-secret:
            scope:
              - user:email
              - read:user

  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
#      password:
#      ssl:
#        enabled: false
server:
  port: 8081

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
  endpoint:
    shutdown:
      enabled: true
info:
  app:
    name: "auth-service"
    description: "This is an Authentication Service"
    version: "1.0"

