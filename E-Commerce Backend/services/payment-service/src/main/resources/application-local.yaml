server:
  port: 8085
spring:
  application:
    name: payment-service

  #Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: postgres
    password: 1234

  # Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Hmac Secret Key Secure Signature
signature:
  key: i4tfI66PYK9wEcfrvxq6jLozkksK5YBt+i7u0w14xF4=

#eureka:
#  instance:
#    prefer-ip-address: true
#  client:
#    fetch-registry: true
#    register-with-eureka: true
#    service-url:
#      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
  endpoint:
    shutdown:
      enabled: true

info:
  app:
    name: "payment-service"
    description: "This is an Payment Service LOCAL SERVER"
    version: "1.0"
