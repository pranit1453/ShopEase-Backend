spring:
  application:
    name: gateway-service

  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
  endpoint:
    gateway:
      enabled: true
info:
  app:
    name: "gateway-service"
    description: "This is a gateway service"
    version: "1.0"

security:
  app:
    issuer: spring

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        automatic-transition-from-open-to-half-open-enabled: true

    instances:
      circuitBreakerProduct:
        base-config: default

logging:
  level:
    com.shopease.security: DEBUG